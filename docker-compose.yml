services:
  secu_postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: secu_db
      POSTGRES_USER: PROYECTO
      POSTGRES_PASSWORD: Proyecto2026!
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql:/docker-entrypoint-initdb.d

  secu_pgadmin:
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@anglo.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - secu_postgres

volumes:
  postgres_data: